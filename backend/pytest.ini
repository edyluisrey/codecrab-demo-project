[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
markers =
    unit: fast tests of a single module with no HTTP layer
    integration: HTTP-level tests through FastAPI TestClient
    functional: multi-step user journeys across several endpoints
filterwarnings =
    error::DeprecationWarning:app.*
    ignore:Dialect sqlite\+pysqlite does \*not\* support Decimal objects natively:sqlalchemy.exc.SAWarning
    ignore:'crypt' is deprecated:DeprecationWarning:passlib.*
    ignore:Using `httpx` with `starlette.testclient` is deprecated
